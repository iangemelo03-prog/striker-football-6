name: Build STRIKER FOOTBALL 6.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar archivos del juego
        run: |
          mkdir -p app/src/main/assets
          cp striker_football_prototipo_5-1.html app/src/main/assets/index.html

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: STRIKER-FOOTBALL-6.0
          path: app/build/outputs/apk/debug/app-debug.apk
